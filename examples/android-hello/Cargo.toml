[package]
name = "android-hello"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

# `examples/hello` as the Android library `RuneActivity` loads (`libmain.so`); built by
# `scripts/android-run.sh`.
[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
rune = { workspace = true, default-features = true }

[lints]
workspace = true
